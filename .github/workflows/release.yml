name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  publish-release:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false
